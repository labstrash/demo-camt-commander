# =============================================================================
# TEST ENVIRONMENT DATABASE CONNECTIVITY
#
# Activate with: --spring.profiles.active=testenv (or SPRING_PROFILES_ACTIVE=testenv)
#
# Only the datasource is overridden here - commander.read.*/commander.scheduling.*
# still come from application.properties, merged in underneath this profile.
#
# No real values belong in this file: every placeholder below is resolved from
# an environment variable at startup, so this file is safe to commit as-is.
# Export before running, e.g.:
#   export TESTENV_DB_URL="jdbc:sqlserver://<host>:1433;databaseName=REPORTDB;encrypt=true;trustServerCertificate=true"
#   export TESTENV_DB_USERNAME=<username>
#   export TESTENV_DB_PASSWORD=<password>
# =============================================================================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=REPORTDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=YourStrong!Passw0rd
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver